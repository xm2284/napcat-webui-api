<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="napcat-webui-api hand-drawn banner">
  <defs>
    <filter id="r" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="r2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="p"/>
      <feColorMatrix in="p" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <style><![CDATA[
      .draw { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 8s ease-in-out infinite; }
      @keyframes draw { 0%{stroke-dashoffset:1100} 22%{stroke-dashoffset:0} 82%{stroke-dashoffset:0} 100%{stroke-dashoffset:1100} }
    ]]></style>
  </defs>

  <rect width="1200" height="340" fill="#fbf7ee"/>
  <rect width="1200" height="340" filter="url(#paper)"/>

  <path d="M26 20 C 320 10, 880 28, 1174 16 C 1182 120, 1176 226, 1172 320 C 880 330, 320 312, 30 324 C 18 214, 30 112, 26 20 Z"
        fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round" filter="url(#r)"/>

  <text x="66" y="146" font-family="'Comic Sans MS','Segoe Print',cursive" font-size="72" font-weight="bold" fill="#1f1f1f" filter="url(#r2)">napcat-webui-api</text>
  <path class="draw" d="M70 176 q 70 -14 140 0 t 140 0 t 140 0 t 96 0" fill="none" stroke="#e07b39" stroke-width="7" stroke-linecap="round" filter="url(#r2)"/>
  <text x="72" y="224" font-family="'Comic Sans MS','Segoe Print',cursive" font-size="25" fill="#3a3a3a" filter="url(#r2)">把 NapCat WebUI 的内部接口封进 Python</text>

  <g font-family="'Comic Sans MS','Segoe Print',cursive" font-size="18" fill="#2b2b2b">
    <g filter="url(#r2)">
      <rect x="74" y="252" width="170" height="44" rx="18" fill="#dceaf6" stroke="#2b2b2b" stroke-width="2.2"/>
      <text x="159" y="280" text-anchor="middle">登录鉴权</text>
    </g>
    <g filter="url(#r2)">
      <rect x="264" y="252" width="150" height="44" rx="18" fill="#e5f0dd" stroke="#2b2b2b" stroke-width="2.2"/>
      <text x="339" y="280" text-anchor="middle">二维码</text>
    </g>
    <g filter="url(#r2)">
      <rect x="434" y="252" width="170" height="44" rx="18" fill="#fde8cf" stroke="#2b2b2b" stroke-width="2.2"/>
      <text x="519" y="280" text-anchor="middle">设备指纹</text>
    </g>
  </g>

  <!-- terminal doodle -->
  <g filter="url(#r)">
    <rect x="836" y="52" width="300" height="168" rx="12" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.4" fill-opacity="1"/>
    <line x1="836" y1="84" x2="1136" y2="84" stroke="#2b2b2b" stroke-width="2.4"/>
    <circle cx="858" cy="68" r="4.5" fill="#2b2b2b"/>
    <circle cx="876" cy="68" r="4.5" fill="#2b2b2b"/>
    <circle cx="894" cy="68" r="4.5" fill="#2b2b2b"/>
  </g>
  <g font-family="Consolas, monospace" font-size="13" fill="#3a3a3a" filter="url(#r2)">
    <text x="852" y="110">&gt;&gt;&gt; from napcat_webui import Client</text>
    <text x="852" y="134">&gt;&gt;&gt; c = Client(token="...")</text>
    <text x="852" y="158">&gt;&gt;&gt; c.qrcode()</text>
    <text x="852" y="186" fill="#2f7d32">'https://txz.qq.com/p?k=...'</text>
    <text x="852" y="210" fill="#8a8a8a">二维码到手</text>
  </g>
</svg>
