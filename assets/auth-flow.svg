<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="napcat-webui-api auth flow">
  <defs>
    <filter id="r" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="r2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="p"/>
      <feColorMatrix in="p" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <style><![CDATA[
      .flow { stroke-dasharray: 9 9; animation: dash 1.3s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -18; } }
    ]]></style>
  </defs>

  <rect width="1000" height="420" fill="#fbf7ee"/>
  <rect width="1000" height="420" filter="url(#paper)"/>

  <text x="40" y="56" font-family="'Comic Sans MS','Segoe Print',cursive" font-size="30" fill="#1f1f1f" filter="url(#r2)">鉴权与登录流程</text>
  <path d="M40 70 q 70 -10 140 0 t 120 0" fill="none" stroke="#e07b39" stroke-width="5" stroke-linecap="round" filter="url(#r2)"/>

  <g font-family="'Comic Sans MS','Segoe Print',cursive">
    <!-- boxes -->
    <g filter="url(#r2)">
      <rect x="20" y="190" width="168" height="118" rx="14" fill="#dceaf6" stroke="#2b2b2b" stroke-width="2.4"/>
      <circle cx="104" cy="150" r="17" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/>
      <text x="104" y="156" text-anchor="middle" font-size="16" fill="#1f1f1f">1</text>
      <text x="104" y="244" text-anchor="middle" font-size="15" fill="#1f1f1f">你的 token</text>
    </g>

    <g filter="url(#r2)">
      <rect x="218" y="190" width="168" height="118" rx="14" fill="#e5f0dd" stroke="#2b2b2b" stroke-width="2.4"/>
      <circle cx="302" cy="150" r="17" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/>
      <text x="302" y="156" text-anchor="middle" font-size="16" fill="#1f1f1f">2</text>
      <text x="302" y="236" text-anchor="middle" font-size="14" fill="#1f1f1f">SHA256(</text>
      <text x="302" y="260" text-anchor="middle" font-size="12" fill="#3a3a3a">token + ".napcat")</text>
    </g>

    <g filter="url(#r2)">
      <rect x="416" y="190" width="168" height="118" rx="14" fill="#fde8cf" stroke="#2b2b2b" stroke-width="2.4"/>
      <circle cx="500" cy="150" r="17" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/>
      <text x="500" y="156" text-anchor="middle" font-size="16" fill="#1f1f1f">3</text>
      <text x="500" y="238" text-anchor="middle" font-size="12" fill="#1f1f1f">POST /api/auth/login</text>
      <text x="500" y="262" text-anchor="middle" font-size="13" fill="#2f7d32">→ Credential</text>
    </g>

    <g filter="url(#r2)">
      <rect x="614" y="190" width="168" height="118" rx="14" fill="#e5f0dd" stroke="#2b2b2b" stroke-width="2.4"/>
      <circle cx="698" cy="150" r="17" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/>
      <text x="698" y="156" text-anchor="middle" font-size="16" fill="#1f1f1f">4</text>
      <text x="698" y="236" text-anchor="middle" font-size="14" fill="#1f1f1f">请求头</text>
      <text x="698" y="260" text-anchor="middle" font-size="12" fill="#3a3a3a">Bearer &lt;Credential&gt;</text>
    </g>

    <g filter="url(#r2)">
      <rect x="812" y="190" width="168" height="118" rx="14" fill="#dceaf6" stroke="#2b2b2b" stroke-width="2.4"/>
      <circle cx="896" cy="150" r="17" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/>
      <text x="896" y="156" text-anchor="middle" font-size="16" fill="#1f1f1f">5</text>
      <text x="896" y="238" text-anchor="middle" font-size="15" fill="#1f1f1f">QQLogin/*</text>
      <text x="896" y="262" text-anchor="middle" font-size="11" fill="#3a3a3a">二维码·状态·设备</text>
    </g>
  </g>

  <g stroke="#2b2b2b" stroke-width="2.4" fill="none" marker-end="url(#ah)">
    <line class="flow" x1="190" y1="249" x2="214" y2="249"/>
    <line class="flow" x1="388" y1="249" x2="412" y2="249"/>
    <line class="flow" x1="586" y1="249" x2="610" y2="249"/>
    <line class="flow" x1="784" y1="249" x2="808" y2="249"/>
  </g>
</svg>
